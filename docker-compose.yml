version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: payrescue_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: payrescue_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payrescue_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payrescue_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payrescue_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/payrescue_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: "prod_payrescue_super_secure_access_secret_key_2026_lagos"
      JWT_REFRESH_SECRET: "prod_payrescue_super_secure_refresh_secret_key_2026_nigeria"
      STORAGE_DRIVER: "local"
    ports:
      - "5000:5000"
    volumes:
      - uploads_volume:/app/uploads

volumes:
  pgdata:
  redisdata:
  uploads_volume:
