services:
  # 1. Backend API Web Service
  - type: web
    name: payrescue-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        fromDatabase:
          name: payrescue-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: COOKIE_SECURE
        value: "true"

  # 2. Frontend React / Vite Static Site (Global CDN - no region)
  - type: web
    name: payrescue-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://payrescue-backend.onrender.com/api/v1

databases:
  # 3. Managed PostgreSQL Database
  - name: payrescue-db
    databaseName: payrescue_db
    user: payrescue_user
    plan: free
    region: oregon
